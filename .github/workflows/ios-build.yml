name: iOS build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      XCODE_JOBS: "2"
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install project generator
        run: brew install xcodegen
      - name: Verify package overwrite protection
        run: python3 scripts/test_plugin_protection_host.py
      - name: Build unsigned IPA
        run: scripts/build_ipa.sh
      - name: Upload candidate (not a release)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: TumoCompanion-candidate-${{ github.sha }}
          path: build/TumoCompanion-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
