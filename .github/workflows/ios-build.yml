name: iOS build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      XCODE_JOBS: "2"
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install project generator
        run: brew install xcodegen
      - name: Verify package overwrite protection
        run: python3 scripts/test_plugin_protection_host.py
      - name: Build unsigned IPA
        run: scripts/build_ipa.sh
      - name: Test managed package protection and installation
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          candidates = [(runtime, device["udid"]) for runtime, entries in devices.items()
                        if "iOS" in runtime for device in entries
                        if device.get("isAvailable") and device["name"].startswith("iPhone")]
          if not candidates:
              raise SystemExit("No available iPhone simulator on CI")
          print(sorted(candidates)[-1][1])
          ')"
          xcodebuild test -project UnleashedCompanion.xcodeproj \
            -scheme UnleashedCompanion -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -jobs "$XCODE_JOBS" -parallel-testing-enabled NO \
            -only-testing:UnleashedTests/ManagedPackageRequirementsTests \
            -only-testing:UnleashedTests/PluginProtectionPolicyTests \
            -only-testing:UnleashedTests/TumoflipInstallerTests \
            -resultBundlePath build/ManagedPackages.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Upload managed package test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: managed-package-tests-${{ github.sha }}
          path: build/ManagedPackages.xcresult
          if-no-files-found: warn
          retention-days: 7
      - name: Upload candidate (not a release)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: TumoCompanion-candidate-${{ github.sha }}
          path: build/TumoCompanion-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
