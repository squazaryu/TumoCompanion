name: iOS build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      XCODE_JOBS: "2"
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install project generator
        run: brew install xcodegen
      - name: Verify package overwrite protection
        run: python3 scripts/test_plugin_protection_host.py
      - name: Verify Community route cleanup and recovery without a device
        run: python3 scripts/test_community_cleanup_host.py
      - name: Verify committed FW Packages recovery without a device
        run: python3 scripts/test_package_recovery_host.py
      - name: Verify exact Dev snapshots and isolated recovery metadata
        run: python3 scripts/test_snapshot_recovery_host.py
      - name: Verify full unit selection cannot be narrowed
        run: python3 scripts/test_ci_test_selection.py
      - name: Verify existing releases cannot be overwritten
        run: python3 scripts/test_publish_immutable_host.py
      - name: Verify bounded ranged-read policy without Bluetooth
        run: python3 scripts/test_rpc_read_budget_host.py
      - name: Verify BLE readiness and RPC evidence without Bluetooth
        run: python3 scripts/test_connection_health_host.py
      - name: Verify actual Flipper GATT properties against CoreBluetooth
        run: python3 scripts/test_ble_gatt_contract_host.py
      - name: Verify explicit finite preview height policy
        run: python3 scripts/test_console_preview_metrics_host.py
      - name: Verify bounded read-only field reports
        run: python3 scripts/test_field_reports_host.py
      - name: Verify checked field workflows with measured logic coverage
        run: python3 scripts/test_field_workflows_host.py --coverage-dir build/field-coverage
      - name: Verify selective backup ZIP handling and Foundation XCTest regressions
        run: |
          python3 scripts/test_field_backup_host.py
          python3 scripts/test_field_unit_host.py
      - name: Build unsigned IPA
        run: scripts/build_ipa.sh

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-build-diagnostics
          path: build/ipa-build.log
          retention-days: 3
      - name: Select iPhone test destination
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          candidates = [(runtime, device["udid"]) for runtime, entries in devices.items()
                        if "iOS" in runtime for device in entries
                        if device.get("isAvailable") and device["name"].startswith("iPhone")]
          if not candidates:
              raise SystemExit("No available iPhone simulator on CI")
          runtime, udid = sorted(candidates)[-1]
          print("CI simulator runtime:", runtime, file=sys.stderr)
          print(udid)
          ')"
          echo "TUMO_CI_SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
      - name: Test complete unit target
        run: |
          set -euo pipefail
          xcodebuild test -project UnleashedCompanion.xcodeproj \
            -scheme UnleashedCompanion -configuration Debug \
            -destination "platform=iOS Simulator,id=$TUMO_CI_SIMULATOR_ID" \
            -jobs "$XCODE_JOBS" -parallel-testing-enabled NO \
            -only-testing:UnleashedTests \
            -resultBundlePath build/AllUnitTests.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Test critical package channel and field UI
        run: |
          set -euo pipefail
          xcodebuild test -project UnleashedCompanion.xcodeproj \
            -scheme UnleashedCompanion -configuration Debug \
            -destination "platform=iOS Simulator,id=$TUMO_CI_SIMULATOR_ID" \
            -jobs "$XCODE_JOBS" -parallel-testing-enabled NO \
            -only-testing:UnleashedUITests/UpdateSourceLayoutUITests/testEmptyDevCatalogCanSwitchToStableInLightMode \
            -only-testing:UnleashedUITests/UpdateSourceLayoutUITests/testEmptyDevCatalogCanSwitchToStableInDarkMode \
            -only-testing:UnleashedUITests/CommunityCleanupUITests \
            -only-testing:UnleashedUITests/FieldReportsUITests \
            -only-testing:UnleashedUITests/FieldWorkflowsUITests \
            -only-testing:UnleashedUITests/ConnectionStatusUITests \
            -resultBundlePath build/ManagedPackages.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Upload managed package test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: managed-package-tests-${{ github.sha }}
          path: |
            build/AllUnitTests.xcresult
            build/ManagedPackages.xcresult
            build/field-coverage/coverage.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload candidate (not a release)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: TumoCompanion-candidate-${{ github.sha }}
          path: build/TumoCompanion-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
